name: Launcher 问题
description: 报告启动、下载、安装或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请删除 Token、Cookie、邮箱、完整本机路径和其他个人信息后再提交。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 11 x64
        - Windows 10 x64
        - macOS Apple Silicon
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yelor Launcher 版本
      placeholder: 例如 0.1.4
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明发生了什么，以及你原本期待的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图
      description: 不要提交账号 Token、验证码、邮箱、完整用户目录或私人服务器地址。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我下载的是本仓库 GitHub Release 中的版本。
          required: true
        - label: 我已经删除日志和截图中的个人信息及凭据。
          required: true
